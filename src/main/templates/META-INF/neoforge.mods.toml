
modLoader="javafml" #mandatory

loaderVersion="${loader_version_range}" #mandatory

license="${mod_license}"

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

authors="LD_Anvil"

logoFile = "logo.png"

description='''
Adjusts the visual appearance of the Vanilla "/title" command, using system fonts to render the text.
Also provides additional features such as Day Counter and Biome Display.
The visual presentation draws inspiration from §oControl§r and §oArknights: Endfield§r.
'''

[modproperties.${mod_id}]
catalogueImageIcon = "icon.png"

[[mixins]]
config="${mod_id}.mixins.json"

#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

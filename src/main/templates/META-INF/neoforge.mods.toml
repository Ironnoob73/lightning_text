
modLoader="javafml" #mandatory

loaderVersion="${loader_version_range}" #mandatory

license="${mod_license}"

[[mods]] #mandatory

modId="${mod_id}" #mandatory

version="${mod_version}" #mandatory

displayName="${mod_name}" #mandatory

authors="LD_Anvil"

description='''
Client side region banners in the style of Wuthering Waves / Arknights: Endfield.
Replaces the vanilla /title display with an oversized banner drawn with a system font (SimHei / 黑体 by default),
and adds a "new day" banner (day number + in-game clock) and a "first time in this biome" banner
(localized biome name + its registry name in the Standard Galactic Alphabet).
Every feature can be toggled in the client config.
'''

[[mixins]]
config="${mod_id}.mixins.json"

#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

[[dependencies.${mod_id}]] #optional
    modId="neoforge" #mandatory
    type="required" #mandatory
    versionRange="[${neo_version},)" #mandatory
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
